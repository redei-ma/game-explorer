name: CI

# Checks every pull request into dev and main, the only way code reaches them.
# Builds and tests the .NET services and the Angular app. The Docker images are
# not built: they compile the same code, so a broken Dockerfile is the one
# thing this does not catch.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build GameExplorer.slnx
      # Only test projects added to GameExplorer.slnx are run.
      - run: dotnet test GameExplorer.slnx --no-build

  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
