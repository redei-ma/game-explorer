name: CI

# Checks every pull request into dev and main, the only way code reaches them.
# Builds and tests the .NET services and the Angular app, and builds the Docker
# images of the delivered setup.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes: a stuck job would use up the Actions quota.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GameExplorer.slnx
      # Only test projects added to GameExplorer.slnx are run.
      - name: Test
        run: dotnet test GameExplorer.slnx --no-build

  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test values, not secrets: Compose refuses to start without them, and
      # this stack exists only inside the job.
      MSSQL_SA_PASSWORD: Ci-Placeholder-1
      RAWG_API_KEY: placeholder
      JWT_KEY: ci-placeholder-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build the images
        run: docker compose build
