# Same check for the three .NET services. The aspnet image has no curl or
# wget, so bash's /dev/tcp sends the request. Healthy only on a 200, which
# auth and library return only while their database answers.
x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8080 &&
      printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
      head -1 <&3 | grep -q ' 200 '
  interval: 10s
  timeout: 5s
  retries: 3
  # Auth and library apply their migrations before answering
  start_period: 30s

services:
  sqlserver:
    # Pinned by digest like the Dockerfile base images. Keep in sync with
    # LibraryApiFactory.cs and AuthApiFactory.cs files in tests/
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    # The image is amd64-only: native on Intel/AMD, emulated (Rosetta) on Apple Silicon
    platform: linux/amd64
    # Restarted after a crash or a Docker restart, not after `docker compose stop`
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Healthy only once SQL Server actually answers a query
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog-service:
    build: ./services/catalog-service
    # Without an init process, a crash at startup leaves the container up but not
    # answering; with it, the container exits (code 134)
    init: true
    restart: unless-stopped
    healthcheck: *dotnet-healthcheck
    environment:
      Igdb__ClientId: ${IGDB_CLIENT_ID:?IGDB_CLIENT_ID is not set in .env}
      Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:?IGDB_CLIENT_SECRET is not set in .env}

  auth-service:
    build: ./services/auth-service
    init: true
    restart: unless-stopped
    healthcheck: *dotnet-healthcheck
    environment:
      # Connects as "sa", the SQL Server administrator. A production setup would
      # use a dedicated login with access to this database only.
      ConnectionStrings__AuthDb: "Server=sqlserver;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (see .env.example)}
    depends_on:
      sqlserver:
        condition: service_healthy

  library-service:
    build: ./services/library-service
    init: true
    restart: unless-stopped
    healthcheck: *dotnet-healthcheck
    environment:
      # Connects as "sa", like auth-service
      ConnectionStrings__LibraryDb: "Server=sqlserver;Database=LibraryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (see .env.example)}
    depends_on:
      sqlserver:
        condition: service_healthy

  gateway:
    build:
      # Built from the repository root: the image needs both frontend/ and gateway/
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      # 8080 only redirects to 8443
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    depends_on:
      # Start order only: nginx resolves service names per request, so it also
      # works while a service is down
      - catalog-service
      - auth-service
      - library-service

volumes:
  sqlserver-data:
