# limit_req_zone is allowed only in the http context, which includes this file
# Login, registration and recovery: each request can test a password, a recovery
# code or whether an email is registered
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Every other API call
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
# nginx's default status for a rejected request is 503
limit_req_status 429;

# Plain HTTP only redirects to HTTPS: the login cookie is Secure. $host has no port,
# so the HTTPS port published in docker-compose.yml is written here
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;

    # Self-signed certificate generated in the image
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Docker's internal DNS: service names are resolved at request time, so nginx
    # starts even when a service is down and follows containers that restart
    resolver 127.0.0.11 valid=10s;

    # Declared once for all locations: a variable in proxy_pass is what makes
    # nginx resolve the name at request time
    set $catalog http://catalog-service:8080;
    set $auth http://auth-service:8080;
    set $library http://library-service:8080;

    # Compiled Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location below, so both rate limits answer the same way
    error_page 429 @too_many_requests;

    # Health checks of the backend services (infrastructure, not part of the API)
    location = /health/catalog {
        proxy_pass $catalog/health;
    }

    location = /health/auth {
        proxy_pass $auth/health;
    }

    location = /health/library {
        proxy_pass $library/health;
    }

    # API routes: with no path after the variable, the request reaches the
    # service with its original URI. nodelay: past the burst, 429 at once instead
    # of delaying the request
    location /api/games {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $catalog;
    }

    location /api/genres {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $catalog;
    }

    location /api/platforms {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $catalog;
    }

    location /api/parent-platforms {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $catalog;
    }

    # Stricter limit for login, registration and recovery only; the rest of
    # /api/auth (me, logout) stays on the API limit. Case-insensitive, with an
    # optional trailing slash, because ASP.NET Core routing matches those variants too
    location ~* ^/api/auth/(login|register|recover)/?$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass $auth;
    }

    location /api/auth {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $auth;
    }

    # Library API: /api/library/favorites/916  ->  library-service /favorites/916
    location /api/library {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $library;
    }

    # Any other /api/ path: a 404, not the Angular page with 200. The routes above
    # win because nginx picks the longest matching prefix. Same ProblemDetails shape
    # as an ASP.NET Core 404
    location /api/ {
        default_type application/problem+json;
        return 404 '{"type":"https://tools.ietf.org/html/rfc9110#section-15.5.5","title":"Not Found","status":404}';
    }

    # Same ProblemDetails shape ASP.NET Core uses for a 429: no type, the status
    # phrase as title (RFC 9457)
    location @too_many_requests {
        default_type application/problem+json;
        return 429 '{"title":"Too Many Requests","status":429,"detail":"Too many requests. Try again shortly."}';
    }

    # Angular routes (e.g. /games/42) are not real files: serve index.html and
    # let the Angular router show the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
