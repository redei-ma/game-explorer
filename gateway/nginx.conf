server {
    listen 80;

    # Docker's internal DNS: service names are resolved at request time, so nginx
    # starts even when a service is down and follows containers that restart
    resolver 127.0.0.11 valid=10s;

    # Declared once for all locations: a variable in proxy_pass is what makes
    # nginx resolve the name at request time
    set $catalog http://catalog-service:8080;
    set $auth http://auth-service:8080;
    set $library http://library-service:8080;

    # Compiled Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Health checks of the backend services (infrastructure, not part of the API)
    location = /health/catalog {
        proxy_pass $catalog/health;
    }

    location = /health/auth {
        proxy_pass $auth/health;
    }

    location = /health/library {
        proxy_pass $library/health;
    }

    # API routes: with no path after the variable, the request reaches the
    # service with its original URI
    location /api/games {
        proxy_pass $catalog;
    }

    location /api/genres {
        proxy_pass $catalog;
    }

    location /api/platforms {
        proxy_pass $catalog;
    }

    location /api/auth {
        proxy_pass $auth;
    }

    # Library API: /api/library/favorites/916  ->  library-service /favorites/916
    location /api/library {
        set $library http://library-service:8080;
        # With a variable in proxy_pass, nginx does not rewrite the path by itself,
        # so we strip the prefix manually. "break" stops further rewriting.
        rewrite ^/api/library/(.*)$ /$1 break;
        proxy_pass $library;
    }

    # Catalog API: same idea. Adjust the target path once we know catalog's real route
    location /api/catalog/ {
        set $catalog http://catalog-service:8080;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog;
    }

    # Angular routes (e.g. /games/42) are not real files: serve index.html and
    # let the Angular router show the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
