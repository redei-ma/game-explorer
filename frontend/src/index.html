<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<title>Novaquest</title>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#0A0F1D">
	<link rel="icon" type="image/x-icon" href="novaquest2.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<style>
		/* Shown only if Angular needs more than a second to start: before that it would just flash */
		.app-loading {
			opacity: 0;
			animation: app-loading-in 0.3s ease-out 1s forwards;
		}
		@keyframes app-loading-in {
			to {
				opacity: 1;
			}
		}
		/* styles.css turns animations off for these users, so the spinner must be visible without one */
		@media (prefers-reduced-motion: reduce) {
			.app-loading {
				opacity: 1;
			}
		}
	</style>
</head>
<body>
	<app-root>
		<div class="app-loading d-flex flex-column align-items-center justify-content-center gap-3 vh-100 text-body-secondary" data-bs-theme="dark" role="status">
			<div class="spinner-border" aria-hidden="true"></div>
			Caricamento…
		</div>
	</app-root>
</body>
</html>
