<section class="container-ge py-5" data-bs-theme="dark">
  <h1 class="mb-4">Il tuo account</h1>

  @if (user(); as user) {
    <dl>
      <dt>Email</dt>
      <dd>{{ user.email }}</dd>
      <dt>Username</dt>
      <dd>{{ user.username }}</dd>
    </dl>
  }

  <p><a routerLink="/favorites">I tuoi preferiti</a></p>

  @if (logoutError(); as message) {
    <div class="alert alert-danger py-2" role="alert">{{ message }}</div>
  }

  <button type="button" class="btn btn-outline-light" [disabled]="loggingOut()" (click)="logout()">
    {{ loggingOut() ? 'Uscita in corso…' : 'Esci' }}
  </button>
</section>
